name: p-trader-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    logging: *default-logging
    shm_size: 128mb

    environment:
      - POSTGRES_DB=${POSTGRES_DB:?required}
      - POSTGRES_USER=${POSTGRES_USER:?required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - database_net

  backend:
    image: p-trader-ai-backend:phase-13g

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    logging: *default-logging
    init: true
    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:size=64m,mode=1777

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      - APP_NAME=P-TRADER AI Backend
      - APP_VERSION=1.0.0
      - APP_DESCRIPTION=Backend API for P-TRADER AI
      - ENVIRONMENT=production
      - DEBUG=false
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - AUTOMATION_RUNTIME_ENABLED=${AUTOMATION_RUNTIME_ENABLED:-true}

      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DATABASE_POOL_SIZE=5
      - DATABASE_MAX_OVERFLOW=10
      - DATABASE_POOL_TIMEOUT_SECONDS=30
      - DATABASE_POOL_RECYCLE_SECONDS=1800

      - SECRET_KEY=${SECRET_KEY:?required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?required}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:?required}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:?required}
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:?required}
      - SECURITY_HEADERS_ENABLED=${SECURITY_HEADERS_ENABLED:?required}
      - METRICS_ENABLED=${METRICS_ENABLED:?required}
      - LOG_JSON_ENABLED=${LOG_JSON_ENABLED:?required}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      - EXCHANGE_TRADING_ENABLED=false
      - EXCHANGE_DRY_RUN=true
      - MAX_ORDER_QUANTITY=1.0
      - MAX_ORDER_VALUE_USD=25.0

      - AI_EXTERNAL_ENABLED=false
      - AI_PROVIDER=OPENAI_COMPATIBLE
      - AI_REQUEST_TIMEOUT_SECONDS=20

      - RUN_DATABASE_MIGRATIONS=true

    expose:
      - "8000"

    networks:
      - application_net
      - database_net

    stop_grace_period: 45s

  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    logging: *default-logging

    security_opt:
      - no-new-privileges:true

    depends_on:
      backend:
        condition: service_healthy

    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:?required}
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-10m}

    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTPS_PORT:-443}:443"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - application_net

    stop_grace_period: 15s

networks:
  application_net:
    name: p_trader_ai_application_net

  database_net:
    name: p_trader_ai_database_net
    internal: true

volumes:
  postgres_data:
    name: p_trader_ai_postgres_data
